<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272324">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="منيو كازو">
<title>منيو كازو — مراجعة وإكمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#272324; --ink2:#5b5350; --muted:#8a817c; --line:#e9e1d8; --bg:#f6f2ed; --card:#fff;
  --beige:#E4D8CC; --beige2:#f1e9e0; --gold:#b08d57;
  --green:#1f8a5b; --green-bg:#e8f6ef; --amber:#c47f12; --amber-bg:#fdf3e1; --grey:#8d8d8d; --grey-bg:#f0efee;
  --red:#b3261e; --radius:18px; --shadow:0 1px 2px rgba(39,35,36,.06),0 4px 16px rgba(39,35,36,.06);
  --hdr:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.55;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hdr .wrap{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--beige);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font-size:18px;font-weight:800;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:#cfc4b8;display:flex;align-items:center;gap:5px}
.saved .dotok{width:7px;height:7px;border-radius:50%;background:#5fd39a;display:inline-block}
.saved.err{color:#ffb4ab}.saved.err .dotok{background:#ff6b5e}
.prog{margin-top:9px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fd39a,#1f8a5b);border-radius:99px;transition:width .35s}
.progtxt{font-size:14px;font-weight:700;white-space:nowrap;color:#fff}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:9px 0 2px}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f3ece5;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:500;min-height:38px}
.tab b{font-weight:700;opacity:.75;margin-inline-start:4px}
.tab.on{background:var(--beige);color:var(--ink);border-color:var(--beige)}
.chips{padding-top:6px;padding-bottom:4px}
.chip{flex:none;border:0;background:rgba(255,255,255,.08);color:#e9dfd5;border-radius:10px;padding:6px 12px;font-size:13.5px;min-height:34px}
.chip.on{background:#fff;color:var(--ink);font-weight:700}
/* intro */
.intro{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:14px 0 10px}
.intro p{margin:0 0 12px;color:var(--ink2);font-size:15px}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 44px 12px 14px;font-size:16px;outline:none;min-height:50px}
.search input:focus{border-color:var(--gold);background:#fff}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-ghost{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:active{background:var(--beige2)}
/* category */
.cat{margin-top:18px}
.cat h2{margin:0 4px 10px;font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:8px;scroll-margin-top:calc(var(--hdr) + 10px)}
.cat h2 small{font-weight:500;color:var(--muted);font-size:13px}
.cat h2 .menu{font-size:12px;font-weight:700;color:var(--gold);background:var(--beige2);border-radius:6px;padding:1px 7px}
.cards{display:flex;flex-direction:column;gap:10px}
/* card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1.5px solid transparent;overflow:hidden;transition:border-color .2s,background .2s}
.card.done{border-color:#9fdcbf;background:linear-gradient(0deg,#fff,#fff) padding-box}
.card.done .head{background:var(--green-bg)}
.card.paused{border-color:#f0cf8f}
.card.paused .head{background:var(--amber-bg)}
.card.cancelled{background:#faf9f8}
.card.cancelled .head{background:var(--grey-bg)}
.card.cancelled .n-ar,.card.cancelled .n-en{text-decoration:line-through;color:var(--grey)}
.card.cancelled .thumb img{filter:grayscale(1);opacity:.6}
.head{display:flex;gap:12px;align-items:center;padding:10px;cursor:pointer;min-height:92px}
.thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--beige2);flex:none;position:relative;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0}
.n-ar{font-weight:800;font-size:16.5px;line-height:1.35}
.n-en{font-size:13.5px;color:var(--ink2);text-align:right;line-height:1.35;margin-top:1px}
.meta{font-size:13.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.price{font-weight:800;color:var(--ink);font-size:14.5px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;line-height:1.6}
.b-done{background:var(--green);color:#fff}
.b-paused{background:var(--amber);color:#fff}
.b-cancel{background:var(--grey);color:#fff}
.b-soft{background:var(--beige2);color:var(--ink2);font-weight:500}
.desc-prev{font-size:13px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .2s;font-size:22px;background:rgba(0,0,0,.03)}
.card.open .chev{transform:rotate(90deg)}
.body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.fld{display:block;margin-top:14px}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px}
.lbl small{font-weight:500;color:var(--muted);font-size:12.5px}
textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;background:#fff;outline:none;resize:vertical;min-height:50px;line-height:1.55}
textarea{min-height:92px}
textarea:focus,.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.15)}
[dir=ltr].inp,textarea[dir=ltr]{text-align:left;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;min-height:18px}
.hint.machine{color:#6b5a2e}.hint.err{color:var(--red)}.hint.busy{color:var(--gold)}
.btn-sm{border:1.5px solid var(--gold);color:#7a5f33;background:#fffaf2;border-radius:10px;padding:5px 14px;font-size:14px;font-weight:700;min-height:38px}
.btn-sm:disabled{opacity:.55}
.linkbtn{border:0;background:none;color:#7a5f33;font-size:14px;font-weight:700;padding:10px 0 2px;text-decoration:underline;text-underline-offset:3px;min-height:40px}
.namefields{background:var(--beige2);border-radius:14px;padding:4px 12px 10px;margin-top:6px}
.namefields .fld{margin-top:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{border:0;border-radius:12px;background:transparent;padding:10px 4px;font-weight:700;font-size:15px;min-height:52px;color:var(--ink2)}
.seg button.on[data-v=active]{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(31,138,91,.3)}
.seg button.on[data-v=cancelled]{background:#6f6f6f;color:#fff}
.seg button.on[data-v=paused]{background:var(--amber);color:#fff;box-shadow:0 2px 8px rgba(196,127,18,.3)}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reason{border:1.5px solid #ecd3a4;background:#fff;border-radius:99px;padding:8px 14px;font-size:14.5px;min-height:44px;font-weight:500}
.reason.on{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700}
.pausebox{background:var(--amber-bg);border-radius:14px;padding:4px 12px 12px;margin-top:10px}
.btn-done{margin-top:18px;width:100%;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-done.is-done{background:var(--green-bg);color:var(--green);border:1.5px solid #9fdcbf}
.empty{text-align:center;color:var(--muted);padding:40px 10px;display:none}
/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));transition:transform .2s}
.bottom .wrap{display:flex;align-items:center;gap:12px}
.bsum{flex:1;font-size:13.5px;color:var(--ink2);line-height:1.4}
.bsum b{color:var(--ink);font-size:15px}
.btn-send{border:0;border-radius:16px;background:var(--green);color:#fff;font-weight:800;font-size:17px;min-height:54px;padding:0 22px;box-shadow:0 4px 14px rgba(31,138,91,.35);display:flex;align-items:center;gap:8px}
body.typing .bottom{transform:translateY(110%)}
/* modal, lightbox, toast */
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,16,15,.55);display:none;align-items:flex-end;justify-content:center;padding:0}
.ov.show{display:flex}
.modal{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease-out;max-height:88vh;overflow:auto}
@media (min-width:640px){.ov{align-items:center}.modal{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin:0 0 8px;font-size:20px;font-weight:800}
.modal .mb{color:var(--ink2);font-size:15.5px}
.modal .mb ol{padding-inline-start:20px;margin:8px 0}
.modal .mb li{margin:4px 0}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.mbtn{border:0;border-radius:14px;min-height:52px;font-weight:800;font-size:16.5px;background:var(--bg);color:var(--ink)}
.mbtn.pri{background:var(--green);color:#fff}
.mbtn.dark{background:var(--ink);color:#fff}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,8,8,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:14px;object-fit:contain;background:#222}
.lb .cap{color:#fff;margin-top:12px;font-weight:700;text-align:center}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warnbar{background:#fdecea;color:var(--red);font-size:13.5px;border-radius:12px;padding:8px 12px;margin-top:10px;display:none}
.hidden{display:none!important}
</style>
</head>

  $('#chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const sec=document.getElementById('cat-'+b.dataset.i);
    if(!sec || sec.classList.contains('hidden')){ toast('ما في أصناف ظاهرة في هذا القسم بالتصفية الحالية'); return; }
    const y=sec.getBoundingClientRect().top+window.scrollY-headerH()-8; window.scrollTo({top:y,behavior:Math.abs(y-window.scrollY)>2500?'auto':'smooth'}); });

function headerH(){ return $('#hdr').offsetHeight; }

function buildList(){
  const list=$('#list'); list.innerHTML=''; ui.els.clear();
  cats.forEach((c,ci)=>{
    const sec=document.createElement('section'); sec.className='cat'; sec.id='cat-'+ci;
    sec.innerHTML='<h2><span class="menu">'+esc(c.menu_ar)+'</span>'+esc(c.ar)+' <small dir="ltr">'+esc(c.en)+'</small> <small class="cc"></small></h2><div class="cards"></div>';
    const wrap=sec.querySelector('.cards');
    items.filter(it=>it.c===ci).forEach(it=>{ const card=buildCard(it); wrap.appendChild(card); });
    list.appendChild(sec);
  });
}
function buildCard(it){
  const el=document.createElement('article'); el.className='card'; el.dataset.id=it.id;
  el.innerHTML='<div class="head" role="button" tabindex="0" aria-expanded="false">'+
    '<button type="button" class="thumb" aria-label="تكبير الصورة"><img loading="lazy" decoding="async" alt=""></button>'+
    '<div class="info"><div class="n-ar"></div><div class="n-en" dir="ltr"></div>'+
    '<div class="meta"><span class="price">'+esc(fmtPrice(it.p))+'</span><span>·</span><span>'+esc(cats[it.c].ar)+'</span></div>'+
    '<div class="desc-prev"></div><div class="badges"></div></div><div class="chev">‹</div></div>';
  const img=el.querySelector('img');
  img.addEventListener('error',function(){ this.onerror=null; if(this.src!==PLACEHOLDER) this.src=PLACEHOLDER; },{once:true});
  img.src=it.img||PLACEHOLDER;
  el.querySelector('.thumb').addEventListener('click',e=>{ e.stopPropagation(); openLb(it); });
  const head=el.querySelector('.head');
  head.addEventListener('click',()=>toggleCard(it.id));
  head.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleCard(it.id);} });
  ui.els.set(it.id, el); refreshCard(it.id); return el;
}
function refreshCard(id){
  const it=byId.get(id), st=state[id], el=ui.els.get(id); if(!el) return;
  el.classList.toggle('done', st.done); el.classList.toggle('paused', st.status==='paused'); el.classList.toggle('cancelled', st.status==='cancelled');
  el.querySelector('.n-ar').textContent=st.name_ar||it.ar; el.querySelector('.n-en').textContent=st.name_en||it.en;
  const dp=el.querySelector('.desc-prev'); dp.textContent=st.desc_ar.trim(); dp.style.display=st.desc_ar.trim()?'':'none';
  let b='';
  if(st.done) b+='<span class="badge b-done">مكتمل ✓</span>';
  if(st.status==='paused') b+='<span class="badge b-paused">موقوف مؤقتاً'+(st.pause_reason?' · '+REASONS.find(r=>r[0]===st.pause_reason)[1]:'')+'</span>';
  if(st.status==='cancelled') b+='<span class="badge b-cancel">ملغي</span>';
  if(nameCorrected(id)) b+='<span class="badge b-soft">اسم مصحّح</span>';
  if(st.availability_note.trim()) b+='<span class="badge b-soft">'+esc(st.availability_note.trim())+'</span>';
  el.querySelector('.badges').innerHTML=b;
}
function nameCorrected(id){ const it=byId.get(id), st=state[id]; return (st.name_ar.trim()||it.ar)!==it.ar || (st.name_en.trim()||it.en)!==it.en; }

function toggleCard(id, force){
  const el=ui.els.get(id); const open = force!==undefined?force:!el.classList.contains('open');
  if(open){ if(!el.querySelector('.body')) el.appendChild(buildBody(byId.get(id))); ui.open.add(id); }
  else { ui.open.delete(id); }
  el.classList.toggle('open', open); el.querySelector('.head').setAttribute('aria-expanded', open);
  const body=el.querySelector('.body'); if(body) body.hidden=!open;
  if(!open) applyFilter();
}

function setHint(id, mode){

  h.className='hint js-hint';
  if(mode==='busy'){ h.classList.add('busy'); h.textContent='جاري الترجمة…'; return; }

  else if(st.desc_en_source==='manual'){ h.textContent='معدّلة يدوياً — ما راح تتغير تلقائياً. اضغط «ترجم» لإعادة الترجمة.'; }

  const st=state[id]; st.done=true; save(); syncBody(id); refreshCard(id); updateCounts();

}

/* ---------- translation (MyMemory, no key) ---------- */
const tCache=new Map();
function chunks(text,max){
  const parts=(text.match(/[^.!?؟،,؛;\n]+[.!?؟،,؛;\n]*/g)||[text]).map(x=>x.trim()).filter(Boolean); const out=[]; let cur='';
  parts.forEach(p=>{ if((cur+' '+p).trim().length<=max){ cur=(cur+' '+p).trim(); } else { if(cur) out.push(cur);
      while(p.length>max){ let cut=p.lastIndexOf(' ',max); if(cut<40) cut=max; out.push(p.slice(0,cut)); p=p.slice(cut).trim(); } cur=p; } });
  if(cur) out.push(cur); return out;
}
function decodeEnt(s){ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; }
async function translateText(ar){
  ar=ar.trim(); if(!ar) return '';
  if(tCache.has(ar)) return tCache.get(ar);
  if(navigator.onLine===false) throw new Error('offline');
  const out=[];
  for(const ch of chunks(ar,200)){
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),12000);
    try{
      const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(ch)+'&langpair=ar|en',{signal:ctrl.signal});
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json(); const txt=j&&j.responseData&&j.responseData.translatedText;
      if(String(j.responseStatus)!=='200' || !txt || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE|PLEASE SELECT/i.test(txt)) throw new Error('api');
      out.push(decodeEnt(txt).trim());
    } finally { clearTimeout(tm); }
  }
  const res=out.join(' '); tCache.set(ar,res); return res;
}
async function doTranslate(id, force){
  const st=state[id]; if(!force && st.desc_en_source==='manual') return;
  const src=st.desc_ar; if(!src.trim()) return;
  const seq=(ui.tseq[id]=(ui.tseq[id]||0)+1);
  const el=ui.els.get(id), btn=el&&el.querySelector('.js-tr'); if(btn) btn.disabled=true;
  setHint(id,'busy');
  try{
    const en=await translateText(src);
    if(ui.tseq[id]!==seq) return;
    if(!force && st.desc_en_source==='manual') return;
    st.desc_en=en; st.desc_en_source='machine'; const t=el&&el.querySelector('.js-den'); if(t) t.value=en; save(); setHint(id);
  }catch(e){ if(ui.tseq[id]===seq) setHint(id,'err'); }
  finally{ if(btn) btn.disabled=false; }
}

/* ---------- filter / counts ---------- */
function visible(it){
  const st=state[it.id];
  const f=ui.filter;
  const okF = f==='all' || (f==='todo'&&!st.done) || (f==='done'&&st.done) || (f==='cancelled'&&st.status==='cancelled') || (f==='paused'&&st.status==='paused');
  if(!okF) return false;
  if(!ui.q) return true;
  const hay=norm([st.name_ar,st.name_en,it.ar,it.en,cats[it.c].ar,cats[it.c].en,st.desc_ar].join(' '));
  return ui.q.split(' ').every(w=>hay.includes(w));
}
function applyFilter(){
  let any=false;
  cats.forEach((c,ci)=>{
    let n=0; items.forEach(it=>{ if(it.c!==ci) return; const v=visible(it)||ui.open.has(it.id); ui.els.get(it.id).classList.toggle('hidden',!v); if(v) n++; });
    const sec=document.getElementById('cat-'+ci); sec.classList.toggle('hidden',n===0); if(n) any=true;
    const chip=document.querySelector('.chip[data-i="'+ci+'"]'); if(chip) chip.style.opacity=n?'':'.45';
  });
  $('#empty').style.display=any?'none':'block';
}
function closeNonMatching(){ [...ui.open].forEach(id=>{ if(!visible(byId.get(id))){ ui.open.delete(id); const el=ui.els.get(id); el.classList.remove('open'); el.querySelector('.head').setAttribute('aria-expanded',false); const bd=el.querySelector('.body'); if(bd) bd.hidden=true; } }); }
function countDone(){ return items.filter(it=>state[it.id].done).length; }
function counts(){
  const c={all:TOTAL,todo:0,done:0,cancelled:0,paused:0,active:0,desc:0};
  items.forEach(it=>{ const s=state[it.id]; if(s.done)c.done++; else c.todo++; if(s.status==='cancelled')c.cancelled++; else if(s.status==='paused')c.paused++; else c.active++; if(s.desc_ar.trim())c.desc++; });
  return c;
}
function updateCounts(){
  const c=counts();
  $('#progTxt').textContent='تم '+c.done+' من '+TOTAL; $('#barFill').style.width=(c.done/TOTAL*100)+'%';
  document.querySelectorAll('.tab b').forEach(b=>b.textContent=c[b.dataset.c]);
  $('#bsum').innerHTML='<b>'+c.done+'</b> مكتمل · باقي <b>'+c.todo+'</b>';
  cats.forEach((cat,ci)=>{ const its=items.filter(it=>it.c===ci); const d=its.filter(it=>state[it.id].done).length;
    const el=document.querySelector('#cat-'+ci+' .cc'); if(el) el.textContent='('+d+'/'+its.length+')'; });
  document.documentElement.style.setProperty('--hdr', headerH()+'px');
}

/* ---------- export ---------- */
function buildExport(){
  const out=items.map(it=>{ const st=state[it.id], c=cats[it.c];
    const nar=st.name_ar.trim()||it.ar, nen=st.name_en.trim()||it.en, den=st.desc_en.trim();
    return { source_item_id:it.id, category_en:c.en, category_ar:c.ar, category_sort:c.sort, item_sort:it.s,
      name_en:nen, name_ar:nar, name_corrected:(nar!==it.ar||nen!==it.en), original_name_en:it.en, original_name_ar:it.ar,
      price:it.p, image_url:it.img||null, description_ar:st.desc_ar.trim()||null, description_en:den||null,
      description_en_source: den?(st.desc_en_source||'manual'):null, status:st.status,
      pause_reason: st.status==='paused'?(st.pause_reason||null):null, availability_note:st.availability_note.trim()||null, done:!!st.done }; });
  const c=counts();
  return { restaurant:'Kazu', source:'OrderCaptain + manager review', exported_at:isoLocal(), currency:'OMR',
    notes_for_claude:'Arabic descriptions (description_ar) are authoritative; they were written by the Kazu manager. English descriptions were machine-translated (MyMemory) unless description_en_source is "manual", and should be polished before use; if description_en is null, translate from description_ar. Items with status "cancelled" must never be offered or recommended by the agent. Items with status "paused" must not be offered while paused; if a customer asks for one, the agent should say it is currently unavailable (use availability_note / pause_reason if helpful). Never claim anything about an item (ingredients, allergens, spiciness, portion size, etc.) that is not stated in its description. Prices are strings in OMR with 3 decimals, exactly as published on OrderCaptain. Items with done=false were not reviewed by the manager yet. If name_corrected is true, use name_en/name_ar (the manager\'s correction) instead of the original names.',
    summary:{ total:TOTAL, done:c.done, active:c.active, cancelled:c.cancelled, paused:c.paused, with_description:c.desc },
    items:out };
}
function download(text, name, type){
  const blob=new Blob([text],{type:type||'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
}
function sendFlow(){
  const c=counts();
  if(c.todo>0){
    modal('باقي '+c.todo+' صنف ما اكتمل', '<p>خلصت <b>'+c.done+'</b> من '+TOTAL+'. تقدر ترسل الحين وتكمل الباقي بعدين، أو ترجع تكمل.</p>', [
      {label:'↩︎ رجوع أكمل', cls:'dark', onClick:()=>{ if(ui.filter!=='todo'){ document.querySelector('.tab[data-f="todo"]').click(); } }},
      {label:'إرسال على كل حال', cls:'pri', onClick:doSend} ]);
  } else doSend();
}
async function doSend(){
  save();
  const data=buildExport(); const json=JSON.stringify(data,null,2); const name='kazu_menu_final_'+ymd()+'.json';
  window.__lastExport=data;
  let shared=false, aborted=false;
  if(navigator.share && navigator.canShare){
    const cands=[new File([json],name,{type:'application/json'}), new File([json],name.replace(/\.json$/,'.txt'),{type:'text/plain'})];
    for(const f of cands){
      let ok=false; try{ ok=navigator.canShare({files:[f]}); }catch(e){}
      if(!ok) continue;
      try{ await navigator.share({files:[f], title:'منيو كازو', text:'منيو كازو بعد المراجعة ('+data.summary.done+'/'+TOTAL+')'}); shared=true; }
      catch(e){ if(e && e.name==='AbortError') aborted=true; }
      break;
    }
  }
  if(shared){ modal('تم الإرسال ✓','<p>شكراً! وصل الملف. إذا عدلت شي بعدين، اضغط «إرسال المنيو» مرة ثانية.</p>',[{label:'تنزيل نسخة على الجهاز',onClick:()=>download(json,name)},{label:'تمام',cls:'pri'}]); return; }
  if(aborted){ modal('ما تم الإرسال','<p>ألغيت نافذة المشاركة. تبغى تحاول مرة ثانية؟</p>',[{label:'حاول مرة ثانية',cls:'pri',onClick:doSend},{label:'تنزيل الملف بدل ذلك',onClick:()=>{download(json,name); showSendHelp(name,json);}},{label:'رجوع'}]); return; }
  download(json,name); showSendHelp(name,json);
}
function showSendHelp(name,json){
  modal('تم تنزيل ملف المنيو 📄',
    '<p>اسم الملف: <b dir="ltr">'+esc(name)+'</b></p><p>أرسله على واتساب كذا:</p><ol>'+
    '<li>افتح <b>واتساب</b> وادخل المحادثة.</li><li>اضغط <b>📎</b> (أو <b>+</b> في الآيفون) ثم <b>مستند</b>.</li>'+
    '<li>اختر الملف من <b>التنزيلات</b> (في الآيفون: تطبيق <b>الملفات</b> ← التنزيلات).</li><li>اضغط <b>إرسال</b>.</li></ol>',
    [{label:'تنزيل الملف مرة ثانية',onClick:()=>{download(json,name); showSendHelp(name,json);},keepOpen:false},{label:'تمام',cls:'pri'}]);
}

/* ---------- backup / restore ---------- */
$('#btnBackup').addEventListener('click',()=>{ save(); const d=new Date();
  download(JSON.stringify(snapshot(),null,1),'kazu_menu_progress_'+ymd(d)+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json');
  toast('تم تنزيل النسخة الاحتياطية 💾'); });
$('#btnRestore').addEventListener('click',()=>$('#fileIn').click());
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ let j; try{ j=JSON.parse(r.result); }catch(err){ modal('ملف غير صالح','<p>هذا الملف مو نسخة احتياطية من المنيو.</p>'); return; }
    const m=parseBackup(j); const n=Object.keys(m).length;
    if(!n){ modal('ملف غير صالح','<p>ما لقيت أصناف كازو في هذا الملف.</p>'); return; }
    modal('استرجاع النسخة؟','<p>لقيت <b>'+n+'</b> صنف في الملف. الاسترجاع راح يستبدل الشغل الحالي على هذا الجهاز.</p>',[
      {label:'نعم، استرجع',cls:'pri',onClick:()=>{ items.forEach(it=>{ state[it.id]=sanitize(it,m[it.id]||state[it.id]); }); ui.open.clear(); buildList(); applyFilter(); updateCounts(); save(); toast('تم الاسترجاع ✓'); }},
      {label:'إلغاء'} ]); };
  r.readAsText(f);
});
function parseBackup(j){
  const m={}; if(!j||typeof j!=='object') return m;
  if(j.items && !Array.isArray(j.items)){ Object.keys(j.items).forEach(k=>{ if(byId.has(+k)) m[+k]=j.items[k]; }); return m; }
  if(Array.isArray(j.items)){ j.items.forEach(x=>{ if(!x||!byId.has(+x.source_item_id)) return;
      m[+x.source_item_id]={ name_ar:x.name_ar, name_en:x.name_en, desc_ar:x.description_ar||'', desc_en:x.description_en||'', desc_en_source:x.description_en_source,
        status:x.status, pause_reason:x.pause_reason, availability_note:x.availability_note||'', done:x.done }; }); }
  return m;
}

/* ---------- search, keyboard ---------- */
let qT; $('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ ui.q=norm(e.target.value); closeNonMatching(); applyFilter(); },150); });
document.addEventListener('focusin',e=>{ if(e.target.matches('textarea,input[type=text],input[type=search]')) document.body.classList.add('typing'); });
document.addEventListener('focusout',()=>setTimeout(()=>{ if(!document.activeElement||!document.activeElement.matches('textarea,input[type=text],input[type=search]')) document.body.classList.remove('typing'); },50));
$('#btnSend').addEventListener('click',sendFlow);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#lb').classList.remove('show'); } });
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hdr', headerH()+'px'));

/* ---------- init ---------- */
const restored=load();
try{ localStorage.setItem(STORE_KEY+'_probe','1'); localStorage.removeItem(STORE_KEY+'_probe'); }catch(e){ ui.storeOk=false; $('#warnStore').style.display='block'; setSaved('الحفظ التلقائي غير متاح',true); }
buildTabs(); buildChips(); buildList(); applyFilter(); updateCounts();
if(restored) toast('رجعنا شغلك المحفوظ ✓');
window.__kazu={state,buildExport,items,cats};
})();
</script>
